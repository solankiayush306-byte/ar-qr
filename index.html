<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza AR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101525;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    main {
      margin: 20px;
      padding: 30px;
      border: 1px solid #465174;
      border-radius: 20px;
    }
    p { color: #c5cee5; }
  </style>
</head>
<body>
  <main>
    <h1>Pizza AR</h1>
    <p>हमारी वेबसाइट का पहला पेज तैयार है!</p>
    <p>अगले चरण में यहाँ 3D पिज्जा जोड़ेंगे।</p>
  </main>
</body>
</html>
