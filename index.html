<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pizza — 3D & AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0c1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 780px;
      margin: auto;
      padding: 24px 16px;
    }

    .tag {
      color: #ffc68a;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: 36px;
    }

    p {
      color: #b9c1d6;
      line-height: 1.6;
    }

    .stage {
      position: relative;
      margin-top: 24px;
      border: 1px solid #303951;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(#303b54, #141b2c);
    }

    model-viewer {
      width: 100%;
      height: 58vh;
      min-height: 320px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 15px 22px;
      border: 0;
      border-radius: 30px;
      color: #241203;
      background: #ffb45e;
      font-weight: bold;
    }

    .help {
      padding: 16px;
      border-radius: 16px;
      background: #171f33;
      font-size: 14px;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
      color: #ffd29d;
    }
  </style>
</head>

<body>
  <main>
    <span class="tag">INTERACTIVE FOOD EXPERIENCE</span>
    <h1>Margherita Pizza</h1>
    <p>अपने पिज्जा को हर तरफ से देखें।</p>

    <div class="stage">
      <model-viewer
        id="pizza"
        src="./models/pizza.glb"
        alt="पिज्जा का 3D मॉडल"
        camera-controls
        auto-rotate
        touch-action="pan-y"
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor">

        <button slot="ar-button" class="ar-button">
          अपनी टेबल पर देखें
        </button>
      </model-viewer>
    </div>

    <p id="status">3D मॉडल लोड हो रहा है…</p>

    <p class="help">
      उंगली से खींचकर घुमाएँ। दो उंगलियों से बड़ा-छोटा करें।
      समर्थित मोबाइल पर “अपनी टेबल पर देखें” दबाकर AR खोलें।
    </p>
  </main>

  <script>
    const pizza = document.getElementById("pizza");
    const status = document.getElementById("status");

    pizza.addEventListener("load", () => {
      status.textContent = "पिज्जा तैयार है—घुमाकर देखें।";
    });

    pizza.addEventListener("error", () => {
      status.textContent =
        "पिज्जा की 3D फ़ाइल अभी नहीं मिली। models/pizza.glb जोड़ना बाकी है।";
    });
  </script>
</body>
</html>
